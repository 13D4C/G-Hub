apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: g-hub
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: 035567003472.dkr.ecr.us-east-1.amazonaws.com/g-hub:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          env:
            - { name: TRANSCODE_INLINE, value: "0" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: g-hub
spec:
  type: NodePort
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080