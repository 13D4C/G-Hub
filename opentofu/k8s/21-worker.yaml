apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: __NAMESPACE__
spec:
  replicas: __WORKER_REPLICAS__
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: __IMAGE__
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: TRANSCODE_INLINE
              value: "1"
          resources:
            requests:
              cpu: 1
              memory: 1Gi
            limits:
              memory: 3Gi
