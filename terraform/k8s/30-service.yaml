apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: g-hub
spec:
  # The ALB in alb.tf sends traffic to this port on every node. Keep it in step with
  # local.node_port there.
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
      protocol: TCP
